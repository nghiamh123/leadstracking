name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend typecheck
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit -p tsconfig.build.json

      - name: Frontend typecheck + build
        working-directory: app
        run: |
          npm ci
          npx tsc -b --noEmit

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/leadstracking
            # Thư mục deploy luôn khớp đúng origin/main - không kẹt vì file bị sửa trên server
            # (.env không nằm trong git nên không bị ảnh hưởng).
            git fetch origin main
            git reset --hard origin/main

            cd backend
            # npm ci cài đúng theo lockfile và không ghi lại nó (npm install trên VPS từng ghi
            # đè package-lock.json khiến lần git pull sau bị từ chối).
            npm ci
            npx prisma generate
            npm run build
            npx prisma migrate deploy

            cd ../app
            npm ci
            npm run build

            pm2 restart funnel-api
